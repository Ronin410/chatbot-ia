<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Demo widget — Chatbot IA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 640px;
        margin: 60px auto;
        padding: 0 20px;
        color: #222;
      }
    </style>
  </head>
  <body>
    <h1>Panadería Dulce Aroma</h1>
    <p>
      Esta es una página de ejemplo del sitio del cliente. El widget de chat
      se embebe con una sola línea de <code>&lt;script&gt;</code>, sin más
      dependencias.
    </p>
    <p>Haz clic en la burbuja de chat en la esquina inferior derecha para probarlo.</p>

    <script
      src="./chatbot.js"
      data-api-url="http://localhost:3000/chat"
      data-title="Panadería Dulce Aroma"
      data-greeting="¡Hola! Soy el asistente de Panadería Dulce Aroma. ¿En qué puedo ayudarte?"
      data-color="#b45309"
      async
    ></script>
  </body>
</html>
